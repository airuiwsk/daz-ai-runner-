name: LLM Control Gemini Research Eval

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/llm-control-eval.yml"
      - "validation/llm-control-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: llm-control-gemini-research-eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout runner repository
        uses: actions/checkout@v7
        with:
          path: runner

      - name: Verify required secrets
        shell: bash
        env:
          DAZ_AI_PAT: ${{ secrets.DAZ_AI_PAT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$DAZ_AI_PAT" || { echo "DAZ_AI_PAT is missing"; exit 1; }
          test -n "$GEMINI_API_KEY" || { echo "GEMINI_API_KEY is missing"; exit 1; }

      - name: Checkout private research repository
        uses: actions/checkout@v7
        with:
          repository: airuiwsk/daz-ai
          ref: main
          token: ${{ secrets.DAZ_AI_PAT }}
          path: daz-ai
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: daz-ai/requirements.txt

      - name: Install dependencies
        working-directory: daz-ai
        run: pip install -r requirements.txt

      - name: Validate research harness
        working-directory: daz-ai
        run: python research/llm-narrative-control/harness/validate_research_harness.py

      - name: Run isolated Gemini 3.8 N=1 evaluation
        id: generate
        working-directory: daz-ai
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set +e
          python research/llm-narrative-control/harness/run_gemini_eval.py
          CODE=$?
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Analyze generated outputs
        working-directory: daz-ai
        if: always()
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          RUN_DIR="research/llm-narrative-control/eval-runs/gemini-smoke/$RUN_ID"
          if [ -f "$RUN_DIR/summary.json" ]; then
            python research/llm-narrative-control/harness/analyze_eval_outputs.py "$RUN_DIR"
          fi
          if [ -f "$RUN_DIR/analysis-summary.json" ]; then
            python research/llm-narrative-control/harness/summarize_eval_diagnostics.py "$RUN_DIR"
          fi

      - name: Persist research outputs to private repository
        working-directory: daz-ai
        if: always()
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          RUN_DIR="research/llm-narrative-control/eval-runs/gemini-smoke/$RUN_ID"
          if [ ! -d "$RUN_DIR" ]; then
            echo "No eval run directory was produced."
            exit 0
          fi

          git config user.name "kindle-factory-research-bot"
          git config user.email "kindle-factory-research-bot@users.noreply.github.com"
          git add "$RUN_DIR"

          if git diff --cached --quiet; then
            echo "No research output changes to commit."
            exit 0
          fi

          git commit -m "Record Gemini 3.8 LLM control smoke run $RUN_ID"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Write non-sensitive runner status
        if: always()
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          EXIT_CODE: ${{ steps.generate.outputs.exit_code }}
        run: |
          set -euo pipefail
          RUN_DIR="daz-ai/research/llm-narrative-control/eval-runs/gemini-smoke/$RUN_ID"
          STATUS="NO_OUTPUT"
          OK_COUNT="0"
          PLANNED_COUNT="12"
          if [ -f "$RUN_DIR/summary.json" ]; then
            STATUS="$(python -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d.get("status","unknown"))' "$RUN_DIR/summary.json")"
            OK_COUNT="$(python -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d.get("ok_count",0))' "$RUN_DIR/summary.json")"
            PLANNED_COUNT="$(python -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d.get("planned_count",12))' "$RUN_DIR/summary.json")"
          fi
          mkdir -p runner/validation
          {
            echo "# LLM Control Research Eval"
            echo
            echo "- Run ID: `$RUN_ID`"
            echo "- Private input SHA: `$(git -C daz-ai rev-parse HEAD)`"
            echo "- Generation status: **$STATUS**"
            echo "- Completed outputs: **$OK_COUNT / $PLANNED_COUNT**"
            echo "- Generation exit code: `${EXIT_CODE:-not-run}`"
            echo "- Model target: `gemini-3.8-flash`"
            echo
            echo "No manuscript, generated prose, prompt text, API key, or private credential is stored in this public status file."
          } > runner/validation/llm-control-latest.md

      - name: Commit runner status
        if: always()
        working-directory: runner
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kindle-factory-research-status"
          git config user.email "kindle-factory-research-status@users.noreply.github.com"
          git add validation/llm-control-latest.md
          if git diff --cached --quiet; then
            echo "No status change."
          else
            git commit -m "Record LLM control research eval status"
            git push origin HEAD:main
          fi
